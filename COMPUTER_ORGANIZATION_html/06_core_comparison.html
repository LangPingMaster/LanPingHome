te deterministically.</span></div><div class=\"line\" data-line=\"98\"><span class=\"no\">098</span><span class=\"source\">    self-&gt;arch_state = (arch_state_t){ 0 };</span></div><div class=\"line\" data-line=\"99\"><span class=\"no\">099</span><span class=\"source\">    self-&gt;new_pc      = 0;</span></div><div class=\"line\" data-line=\"100\"><span class=\"no\">100</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"101\"><span class=\"no\">101</span><span class=\"source\">    // initialize memory map object</span></div><div class=\"line\" data-line=\"102\"><span class=\"no\">102</span><span class=\"source\">    // prepare for being added new MMIO devices</span></div><div class=\"line\" data-line=\"103\"><span class=\"no\">103</span><span class=\"source\">    MemoryMap_ctor(&amp;self-&gt;mem_map);</span></div><div class=\"line\" data-line=\"104\"><span class=\"no\">104</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"105\"><span class=\"no\">105</span><span class=\"source\">    // initialize base class (Tick)</span></div><div class=\"line\" data-line=\"106\"><span class=\"no\">106</span><span class=\"source\">    Tick_ctor(&amp;self-&gt;super);</span></div><div class=\"line\" data-line=\"107\"><span class=\"no\">107</span><span class=\"source\">    static struct TickVtbl const vtbl = { .tick = SIGNATURE_TICK_TICK(Core) };</span></div><div class=\"line\" data-line=\"108\"><span class=\"no\">108</span><span class=\"source\">    self-&gt;super.vtbl                  = &amp;vtbl;</span></div><div class=\"line\" data-line=\"109\"><span class=\"no\">109</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"110\"><span class=\"no\">110</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"111\"><span class=\"no\">111</span><span class=\"source\">void Core_dtor(Core *self) {</span></div><div class=\"line\" data-line=\"112\"><span class=\"no\">112</span><span class=\"source\">    assert(self != NULL);</span></div><div class=\"line\" data-line=\"113\"><span class=\"no\">113</span><span class=\"source\">    MemoryMap_dtor(&amp;self-&gt;mem_map);</span></div><div class=\"line\" data-line=\"114\"><span class=\"no\">114</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"115\"><span class=\"no\">115</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"116\"><span class=\"no\">116</span><span class=\"source\">int Core_add_device(Core *self, mmap_unit_t new_device) {</span></div><div class=\"line\" data-line=\"117\"><span class=\"no\">117</span><span class=\"source\">    return MemoryMap_add_device(&amp;self-&gt;mem_map, new_device);</span></div><div class=\"line\" data-line=\"118\"><span class=\"no\">118</span><span class=\"source\">}</span></div>";const newLines="<div class=\"line\" data-line=\"1\"><span class=\"no\">001</span><span class=\"source\">/*</span></div><div class=\"line\" data-line=\"2\"><span class=\"no\">002</span><span class=\"source\"> * Lab 1：RV32I 指令集模擬器核心（繁體中文教學註解版）</span></div><div class=\"line\" data-line=\"3\"><span class=\"no\">003</span><span class=\"source\"> *</span></div><div class=\"line\" data-line=\"4\"><span class=\"no\">004</span><span class=\"source\"> * 一個指令週期：Core_fetch → Core_decode → Core_execute → Core_update_pc。</span></div><div class=\"line\" data-line=\"5\"><span class=\"no\">005</span><span class=\"source\"> * Fetch 讀取 32 位元機器碼；Decode 以 opcode／funct3／funct7 判斷種類；</span></div><div class=\"line\" data-line=\"6\"><span class=\"no\">006</span><span class=\"source\"> * Execute 依指令更新暫存器、記憶體或 new_pc；最後提交 current_pc。</span></div><div class=\"line\" data-line=\"7\"><span class=\"no\">007</span><span class=\"source\"> *</span></div><div class=\"line\" data-line=\"8\"><span class=\"no\">008</span><span class=\"source\"> * 核心原則：所有地址與暫存器均為 32 位元；x0 永遠維持 0；</span></div><div class=\"line\" data-line=\"9\"><span class=\"no\">009</span><span class=\"source\"> * 預設 PC 加 4，分支與跳躍可覆蓋；記憶體依小端序排列。</span></div><div class=\"line\" data-line=\"10\"><span class=\"no\">010</span><span class=\"source\"> * 此版本集中處理立即數符號延伸，避免對有號右移與位元欄位符號性的依賴。</span></div><div class=\"line\" data-line=\"11\"><span class=\"no\">011</span><span class=\"source\"> */</span></div><div class=\"line\" data-line=\"12\"><span class=\"no\">012</span><span class=\"source\">#include \"core.h\"</span></div><div class=\"line\" data-line=\"13\"><span class=\"no\">013</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"14\"><span class=\"no\">014</span><span class=\"source\">#include \"inst.h\"</span></div><div class=\"line\" data-line=\"15\"><span class=\"no\">015</span><span class=\"source\">#include \"tick.h\"</span></div><div class=\"line\" data-line=\"16\"><span class=\"no\">016</span><span class=\"source\">#include \"arch.h\"</span></div><div class=\"line\" data-line=\"17\"><span class=\"no\">017</span><span class=\"source\">#include \"mem_map.h\"</span></div><div class=\"line\" data-line=\"18\"><span class=\"no\">018</span><span class=\"source\">#include \"common.h\"</span></div><div class=\"line\" data-line=\"19\"><span class=\"no\">019</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"20\"><span class=\"no\">020</span><span class=\"source\">#include &lt;stddef.h&gt;</span></div><div class=\"line\" data-line=\"21\"><span class=\"no\">021</span><span class=\"source\">#include &lt;assert.h&gt;</span></div><div class=\"line\" data-line=\"22\"><span class=\"no\">022</span><span class=\"source\">#include &lt;stdbool.h&gt;</span></div><div class=\"line\" data-line=\"23\"><span class=\"no\">023</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"24\"><span class=\"no\">024</span><span class=\"source\">/*</span></div><div class=\"line\" data-line=\"25\"><span class=\"no\">025</span><span class=\"source\"> * 標頭用途：core.h 為核心結構與公開介面；inst.h 提供指令欄位及列舉；</span></div><div class=\"line\" data-line=\"26\"><span class=\"no\">026</span><span class=\"source\"> * tick.h 提供每週期回呼；arch.h 定義 32 位元型別與架構狀態；</span></div><div class=\"line\" data-line=\"27\"><span class=\"no\">027</span><span class=\"source\"> * mem_map.h 提供 MMIO 存取；common.h 提供 container_of 等巨集。</span></div><div class=\"line\" data-line=\"28\"><span class=\"no\">028</span><span class=\"source\"> * stdbool.h 提供 bool／true／false。</span></div><div class=\"line\" data-line=\"29\"><span class=\"no\">029</span><span class=\"source\"> */</span></div><div class=\"line\" data-line=\"30\"><span class=\"no\">030</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"31\"><span class=\"no\">031</span><span class=\"source\">/* 將 width 位的無號立即數擴展為 RV32 位元圖樣（width 範圍 1～31）。</span></div><div class=\"line\" data-line=\"32\"><span class=\"no\">032</span><span class=\"source\"> * 全程使用無號運算：最高位為 1 時，減去 2^width，得到二補數結果。</span></div><div class=\"line\" data-line=\"33\"><span class=\"no\">033</span><span class=\"source\"> */</span></div><div class=\"line\" data-line=\"34\"><span class=\"no\">034</span><span class=\"source\">static reg_t sign_extend(reg_t value, unsigned width) {</span></div><div class=\"line\" data-line=\"35\"><span class=\"no\">035</span><span class=\"source\">    const reg_t sign = (reg_t)1u &lt;&lt; (width - 1u);</span></div><div class=\"line\" data-line=\"36\"><span class=\"no\">036</span><span class=\"source\">    const reg_t mask = ((reg_t)1u &lt;&lt; width) - 1u;</span></div><div class=\"line\" data-line=\"37\"><span class=\"no\">037</span><span class=\"source\">    value &amp;= mask;</span></div><div class=\"line\" data-line=\"38\"><span class=\"no\">038</span><span class=\"source\">    return (value ^ sign) - sign;</span></div><div class=\"line\" data-line=\"39\"><span class=\"no\">039</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"40\"><span class=\"no\">040</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"41\"><span class=\"no\">041</span><span class=\"source\">// ISS Fetch stage</span></div><div class=\"line\" data-line=\"42\"><span class=\"no\">042</span><span class=\"source\">static inst_fields_t Core_fetch(Core *self) {</span></div><div class=\"line\" data-line=\"43\"><span class=\"no\">043</span><span class=\"source\">    // PC 指向當前指令。經由記憶體映射讀四個連續位元組。</span></div><div class=\"line\" data-line=\"44\"><span class=\"no\">044</span><span class=\"source\">    byte_t inst_in_bytes[4] = {};</span></div><div class=\"line\" data-line=\"45\"><span class=\"no\">045</span><span class=\"source\">    MemoryMap_generic_load(&amp;self-&gt;mem_map, self-&gt;arch_state.current_pc, 4, inst_in_bytes);</span></div><div class=\"line\" data-line=\"46\"><span class=\"no\">046</span><span class=\"source\">    // RISC-V 使用小端序：地址最低的 byte 放在指令 bits[7:0]，</span></div><div class=\"line\" data-line=\"47\"><span class=\"no\">047</span><span class=\"source\">    // 後續三個 byte 依次左移 8、16、24 位元再組合成 32 位元。</span></div><div class=\"line\" data-line=\"48\"><span class=\"no\">048</span><span class=\"source\">    inst_fields_t ret = {};</span></div><div class=\"line\" data-line=\"49\"><span class=\"no\">049</span><span class=\"source\">    ret.raw |= (reg_t)inst_in_bytes[0];</span></div><div class=\"line\" data-line=\"50\"><span class=\"no\">050</span><span class=\"source\">    ret.raw |= (reg_t)inst_in_bytes[1] &lt;&lt; 8;</span></div><div class=\"line\" data-line=\"51\"><span class=\"no\">051</span><span class=\"source\">    ret.raw |= (reg_t)inst_in_bytes[2] &lt;&lt; 16;</span></div><div class=\"line\" data-line=\"52\"><span class=\"no\">052</span><span class=\"source\">    ret.raw |= (reg_t)inst_in_bytes[3] &lt;&lt; 24;</span></div><div class=\"line\" data-line=\"53\"><span class=\"no\">053</span><span class=\"source\">    return ret;</span></div><div class=\"line\" data-line=\"54\"><span class=\"no\">054</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"55\"><span class=\"no\">055</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"56\"><span class=\"no\">056</span><span class=\"source\">/*</span></div><div class=\"line\" data-line=\"57\"><span class=\"no\">057</span><span class=\"source\"> * Decode 的輸出是 inst_enum_t，不會在此階段改動暫存器或記憶體。</span></div><div class=\"line\" data-line=\"58\"><span class=\"no\">058</span><span class=\"source\"> * 先判斷 bits[6:0] 的 opcode；同一 opcode 有多種指令時，再檢查</span></div><div class=\"line\" data-line=\"59\"><span class=\"no\">059</span><span class=\"source\"> * bits[14:12] 的 funct3 與 bits[31:25] 的 funct7。</span></div><div class=\"line\" data-line=\"60\"><span class=\"no\">060</span><span class=\"source\"> * 若沒有符合 Lab 1 的 37 種合法編碼，保持 inst_invalid。</span></div><div class=\"line\" data-line=\"61\"><span class=\"no\">061</span><span class=\"source\"> */</span></div><div class=\"line\" data-line=\"62\"><span class=\"no\">062</span><span class=\"source\">// ISS decode stage</span></div><div class=\"line\" data-line=\"63\"><span class=\"no\">063</span><span class=\"source\">static inst_enum_t Core_decode(Core *self, inst_fields_t inst_fields) {</span></div><div class=\"line\" data-line=\"64\"><span class=\"no\">064</span><span class=\"source\">    (void)self; // Decode 只使用機器碼；此參數保留介面形式並避免未使用警告。</span></div><div class=\"line\" data-line=\"65\"><span class=\"no\">065</span><span class=\"source\">    inst_enum_t ret = inst_invalid;</span></div><div class=\"line\" data-line=\"66\"><span class=\"no\">066</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"67\"><span class=\"no\">067</span><span class=\"source\">    const reg_t opcode = inst_fields.R_TYPE.opcode;</span></div><div class=\"line\" data-line=\"68\"><span class=\"no\">068</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"69\"><span class=\"no\">069</span><span class=\"source\">    const reg_t funct3 = inst_fields.R_TYPE.func3;</span></div><div class=\"line\" data-line=\"70\"><span class=\"no\">070</span><span class=\"source\">    const reg_t funct7 = inst_fields.R_TYPE.func7;</span></div><div class=\"line\" data-line=\"71\"><span class=\"no\">071</span><span class=\"source\">    // 指令群組：OP 10、OP_IMM 9、LOAD 5、STORE 3、BRANCH 6，</span></div><div class=\"line\" data-line=\"72\"><span class=\"no\">072</span><span class=\"source\">    // JAL／JALR／AUIPC／LUI 各 1，共 37 種。</span></div><div class=\"line\" data-line=\"73\"><span class=\"no\">073</span><span class=\"source\">    switch (opcode) {</span></div><div class=\"line\" data-line=\"74\"><span class=\"no\">074</span><span class=\"source\">    case OP: { // R-type：來源 rs1、rs2；ADD/SUB 與 SRL/SRA 需 funct7 區分。</span></div><div class=\"line\" data-line=\"75\"><span class=\"no\">075</span><span class=\"source\">        if (funct3 == ADD_SUB_FUNC3) {</span></div><div class=\"line\" data-line=\"76\"><span class=\"no\">076</span><span class=\"source\">            if (funct7 == 0) ret = inst_add;</span></div><div class=\"line\" data-line=\"77\"><span class=\"no\">077</span><span class=\"source\">            if (funct7 == 0x20) ret = inst_sub;</span></div><div class=\"line\" data-line=\"78\"><span class=\"no\">078</span><span class=\"source\">        } else if (funct7 == 0) {</span></div><div class=\"line\" data-line=\"79\"><span class=\"no\">079</span><span class=\"source\">            switch (funct3) {</span></div><div class=\"line\" data-line=\"80\"><span class=\"no\">080</span><span class=\"source\">            case SLL_FUNC3: ret = inst_sll; break;</span></div><div class=\"line\" data-line=\"81\"><span class=\"no\">081</span><span class=\"source\">            case SLT_FUNC3: ret = inst_slt; break;</span></div><div class=\"line\" data-line=\"82\"><span class=\"no\">082</span><span class=\"source\">            case SLTU_FUNC3: ret = inst_sltu; break;</span></div><div class=\"line\" data-line=\"83\"><span class=\"no\">083</span><span class=\"source\">            case XOR_FUNC3: ret = inst_xor; break;</span></div><div class=\"line\" data-line=\"84\"><span class=\"no\">084</span><span class=\"source\">            case SRL_SRA_FUNC3: ret = inst_srl; break;</span></div><div class=\"line\" data-line=\"85\"><span class=\"no\">085</span><span class=\"source\">            case OR_FUNC3: ret = inst_or; break;</span></div><div class=\"line\" data-line=\"86\"><span class=\"no\">086</span><span class=\"source\">            case AND_FUNC3: ret = inst_and; break;</span></div><div class=\"line\" data-line=\"87\"><span class=\"no\">087</span><span class=\"source\">            }</span></div><div class=\"line\" data-line=\"88\"><span class=\"no\">088</span><span class=\"source\">        } else if (funct3 == SRL_SRA_FUNC3 &amp;&amp; funct7 == 0x20) {</span></div><div class=\"line\" data-line=\"89\"><span class=\"no\">089</span><span class=\"source\">            ret = inst_sra;</span></div><div class=\"line\" data-line=\"90\"><span class=\"no\">090</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"91\"><span class=\"no\">091</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"92\"><span class=\"no\">092</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"93\"><span class=\"no\">093</span><span class=\"source\">    case OP_IMM: { // I-type：來源 rs1 及帶符號立即數；位移量取低五位。</span></div><div class=\"line\" data-line=\"94\"><span class=\"no\">094</span><span class=\"source\">        switch (funct3) {</span></div><div class=\"line\" data-line=\"95\"><span class=\"no\">095</span><span class=\"source\">        case ADD_SUB_FUNC3: ret = inst_addi; break;</span></div><div class=\"line\" data-line=\"96\"><span class=\"no\">096</span><span class=\"source\">        case SLT_FUNC3: ret = inst_slti; break;</span></div><div class=\"line\" data-line=\"97\"><span class=\"no\">097</span><span class=\"source\">        case SLTU_FUNC3: ret = inst_sltiu; break;</span></div><div class=\"line\" data-line=\"98\"><span class=\"no\">098</span><span class=\"source\">        case XOR_FUNC3: ret = inst_xori; break;</span></div><div class=\"line\" data-line=\"99\"><span class=\"no\">099</span><span class=\"source\">        case OR_FUNC3: ret = inst_ori; break;</span></div><div class=\"line\" data-line=\"100\"><span class=\"no\">100</span><span class=\"source\">        case AND_FUNC3: ret = inst_andi; break;</span></div><div class=\"line\" data-line=\"101\"><span class=\"no\">101</span><span class=\"source\">        case SLL_FUNC3: if (funct7 == 0) ret = inst_slli; break;</span></div><div class=\"line\" data-line=\"102\"><span class=\"no\">102</span><span class=\"source\">        case SRL_SRA_FUNC3:</span></div><div class=\"line\" data-line=\"103\"><span class=\"no\">103</span><span class=\"source\">            if (funct7 == 0) ret = inst_srli;</span></div><div class=\"line\" data-line=\"104\"><span class=\"no\">104</span><span class=\"source\">            if (funct7 == 0x20) ret = inst_srai;</span></div><div class=\"line\" data-line=\"105\"><span class=\"no\">105</span><span class=\"source\">            break;</span></div><div class=\"line\" data-line=\"106\"><span class=\"no\">106</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"107\"><span class=\"no\">107</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"108\"><span class=\"no\">108</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"109\"><span class=\"no\">109</span><span class=\"source\">    case LOAD: { // 依 funct3 區分 8／16／32 位元及是否做符號延伸。</span></div><div class=\"line\" data-line=\"110\"><span class=\"no\">110</span><span class=\"source\">        switch (funct3) {</span></div><div class=\"line\" data-line=\"111\"><span class=\"no\">111</span><span class=\"source\">        case LB_FUNC3: ret = inst_lb; break;</span></div><div class=\"line\" data-line=\"112\"><span class=\"no\">112</span><span class=\"source\">        case LH_FUNC3: ret = inst_lh; break;</span></div><div class=\"line\" data-line=\"113\"><span class=\"no\">113</span><span class=\"source\">        case LW_FUNC3: ret = inst_lw; break;</span></div><div class=\"line\" data-line=\"114\"><span class=\"no\">114</span><span class=\"source\">        case LBU_FUNC3: ret = inst_lbu; break;</span></div><div class=\"line\" data-line=\"115\"><span class=\"no\">115</span><span class=\"source\">        case LHU_FUNC3: ret = inst_lhu; break;</span></div><div class=\"line\" data-line=\"116\"><span class=\"no\">116</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"117\"><span class=\"no\">117</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"118\"><span class=\"no\">118</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"119\"><span class=\"no\">119</span><span class=\"source\">    case STORE: { // SB／SH／SW 分別寫入 1／2／4 個位元組。</span></div><div class=\"line\" data-line=\"120\"><span class=\"no\">120</span><span class=\"source\">        switch (funct3) {</span></div><div class=\"line\" data-line=\"121\"><span class=\"no\">121</span><span class=\"source\">        case SB_FUNC3: ret = inst_sb; break;</span></div><div class=\"line\" data-line=\"122\"><span class=\"no\">122</span><span class=\"source\">        case SH_FUNC3: ret = inst_sh; break;</span></div><div class=\"line\" data-line=\"123\"><span class=\"no\">123</span><span class=\"source\">        case SW_FUNC3: ret = inst_sw; break;</span></div><div class=\"line\" data-line=\"124\"><span class=\"no\">124</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"125\"><span class=\"no\">125</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"126\"><span class=\"no\">126</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"127\"><span class=\"no\">127</span><span class=\"source\">    case BRANCH: { // BEQ/BNE、signed BLT/BGE、unsigned BLTU/BGEU。</span></div><div class=\"line\" data-line=\"128\"><span class=\"no\">128</span><span class=\"source\">        switch (funct3) {</span></div><div class=\"line\" data-line=\"129\"><span class=\"no\">129</span><span class=\"source\">        case BEQ_FUNC3: ret = inst_beq; break;</span></div><div class=\"line\" data-line=\"130\"><span class=\"no\">130</span><span class=\"source\">        case BNE_FUNC3: ret = inst_bne; break;</span></div><div class=\"line\" data-line=\"131\"><span class=\"no\">131</span><span class=\"source\">        case BLT_FUNC3: ret = inst_blt; break;</span></div><div class=\"line\" data-line=\"132\"><span class=\"no\">132</span><span class=\"source\">        case BGE_FUNC3: ret = inst_bge; break;</span></div><div class=\"line\" data-line=\"133\"><span class=\"no\">133</span><span class=\"source\">        case BLTU_FUNC3: ret = inst_bltu; break;</span></div><div class=\"line\" data-line=\"134\"><span class=\"no\">134</span><span class=\"source\">        case BGEU_FUNC3: ret = inst_bgeu; break;</span></div><div class=\"line\" data-line=\"135\"><span class=\"no\">135</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"136\"><span class=\"no\">136</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"137\"><span class=\"no\">137</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"138\"><span class=\"no\">138</span><span class=\"source\">    case JAL: { // 直接跳躍並將原 PC+4 寫入 rd。</span></div><div class=\"line\" data-line=\"139\"><span class=\"no\">139</span><span class=\"source\">        ret = inst_jal;</span></div><div class=\"line\" data-line=\"140\"><span class=\"no\">140</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"141\"><span class=\"no\">141</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"142\"><span class=\"no\">142</span><span class=\"source\">    case JALR: { // 間接跳躍；合法 RV32I JALR 的 funct3 必須為 000。</span></div><div class=\"line\" data-line=\"143\"><span class=\"no\">143</span><span class=\"source\">        if (funct3 == 0) ret = inst_jalr;</span></div><div class=\"line\" data-line=\"144\"><span class=\"no\">144</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"145\"><span class=\"no\">145</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"146\"><span class=\"no\">146</span><span class=\"source\">    case AUIPC: { // rd ← 原 PC + 高 20 位立即數左移 12 位。</span></div><div class=\"line\" data-line=\"147\"><span class=\"no\">147</span><span class=\"source\">        ret = inst_auipc;</span></div><div class=\"line\" data-line=\"148\"><span class=\"no\">148</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"149\"><span class=\"no\">149</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"150\"><span class=\"no\">150</span><span class=\"source\">    case LUI: { // rd ← 高 20 位立即數左移 12 位。</span></div><div class=\"line\" data-line=\"151\"><span class=\"no\">151</span><span class=\"source\">        ret = inst_lui;</span></div><div class=\"line\" data-line=\"152\"><span class=\"no\">152</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"153\"><span class=\"no\">153</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"154\"><span class=\"no\">154</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"155\"><span class=\"no\">155</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"156\"><span class=\"no\">156</span><span class=\"source\">    return ret;</span></div><div class=\"line\" data-line=\"157\"><span class=\"no\">157</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"158\"><span class=\"no\">158</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"159\"><span class=\"no\">159</span><span class=\"source\">/*</span></div><div class=\"line\" data-line=\"160\"><span class=\"no\">160</span><span class=\"source\"> * Execute 讀取舊架構狀態，計算結果並決定新的 PC。對所有寫 rd 的指令，</span></div><div class=\"line\" data-line=\"161\"><span class=\"no\">161</span><span class=\"source\"> * 最後統一寫入，確保 rs1 與 rd 相同時仍使用原本的 rs1 值。</span></div><div class=\"line\" data-line=\"162\"><span class=\"no\">162</span><span class=\"source\"> * 加減以 uint32_t 的模 2^32 運算自然實現 RV32I 溢位環繞。</span></div><div class=\"line\" data-line=\"163\"><span class=\"no\">163</span><span class=\"source\"> */</span></div><div class=\"line\" data-line=\"164\"><span class=\"no\">164</span><span class=\"source\">// ISS execute and commit stage (two-in-one)</span></div><div class=\"line\" data-line=\"165\"><span class=\"no\">165</span><span class=\"source\">static void Core_execute(Core *self, inst_fields_t inst_fields, inst_enum_t inst_enum) {</span></div><div class=\"line\" data-line=\"166\"><span class=\"no\">166</span><span class=\"source\">    // 預設下一個 PC；分支與跳躍可覆蓋。</span></div><div class=\"line\" data-line=\"167\"><span class=\"no\">167</span><span class=\"source\">    self-&gt;new_pc = self-&gt;arch_state.current_pc + 4;</span></div><div class=\"line\" data-line=\"168\"><span class=\"no\">168</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"169\"><span class=\"no\">169</span><span class=\"source\">    // raw 是原始 32 位元機器碼；抽取 rd、rs1、rs2 的 5 位元索引。</span></div><div class=\"line\" data-line=\"170\"><span class=\"no\">170</span><span class=\"source\">    // 例如 rs1=5 表示要讀 gpr[5]，不是把數值 5 當成運算元。</span></div><div class=\"line\" data-line=\"171\"><span class=\"no\">171</span><span class=\"source\">    const uint32_t raw = inst_fields.raw;</span></div><div class=\"line\" data-line=\"172\"><span class=\"no\">172</span><span class=\"source\">    const unsigned rd = (raw &gt;&gt; 7) &amp; 31u;</span></div><div class=\"line\" data-line=\"173\"><span class=\"no\">173</span><span class=\"source\">    const unsigned rs1 = (raw &gt;&gt; 15) &amp; 31u;</span></div><div class=\"line\" data-line=\"174\"><span class=\"no\">174</span><span class=\"source\">    const unsigned rs2 = (raw &gt;&gt; 20) &amp; 31u;</span></div><div class=\"line\" data-line=\"175\"><span class=\"no\">175</span><span class=\"source\">    // 先讀取來源暫存器：JALR 的 rd==rs1 時尤為重要。</span></div><div class=\"line\" data-line=\"176\"><span class=\"no\">176</span><span class=\"source\">    const reg_t a = self-&gt;arch_state.gpr[rs1];</span></div><div class=\"line\" data-line=\"177\"><span class=\"no\">177</span><span class=\"source\">    const reg_t b = self-&gt;arch_state.gpr[rs2];</span></div><div class=\"line\" data-line=\"178\"><span class=\"no\">178</span><span class=\"source\">    // RV32I 移位只使用位移來源的低 5 位，範圍為 0～31。</span></div><div class=\"line\" data-line=\"179\"><span class=\"no\">179</span><span class=\"source\">    const unsigned shift = b &amp; 31u;</span></div><div class=\"line\" data-line=\"180\"><span class=\"no\">180</span><span class=\"source\">    // 從原始機器碼重組各型立即數，先組位元再做 RV32 符號延伸。</span></div><div class=\"line\" data-line=\"181\"><span class=\"no\">181</span><span class=\"source\">    // 保持 reg_t 的 32 位元圖樣，與無號位址運算相加時自然環繞。</span></div><div class=\"line\" data-line=\"182\"><span class=\"no\">182</span><span class=\"source\">    const reg_t imm_i = sign_extend(raw &gt;&gt; 20, 12);</span></div><div class=\"line\" data-line=\"183\"><span class=\"no\">183</span><span class=\"source\">    const reg_t imm_s = sign_extend(((raw &gt;&gt; 25) &lt;&lt; 5) |</span></div><div class=\"line\" data-line=\"184\"><span class=\"no\">184</span><span class=\"source\">                                     ((raw &gt;&gt; 7) &amp; 0x1fu), 12);</span></div><div class=\"line\" data-line=\"185\"><span class=\"no\">185</span><span class=\"source\">    const reg_t imm_b = sign_extend(((raw &gt;&gt; 31) &lt;&lt; 12) |</span></div><div class=\"line\" data-line=\"186\"><span class=\"no\">186</span><span class=\"source\">                                     (((raw &gt;&gt; 7) &amp; 1u) &lt;&lt; 11) |</span></div><div class=\"line\" data-line=\"187\"><span class=\"no\">187</span><span class=\"source\">                                     (((raw &gt;&gt; 25) &amp; 0x3fu) &lt;&lt; 5) |</span></div><div class=\"line\" data-line=\"188\"><span class=\"no\">188</span><span class=\"source\">                                     (((raw &gt;&gt; 8) &amp; 0xfu) &lt;&lt; 1), 13);</span></div><div class=\"line\" data-line=\"189\"><span class=\"no\">189</span><span class=\"source\">    const reg_t imm_j = sign_extend(((raw &gt;&gt; 31) &lt;&lt; 20) |</span></div><div class=\"line\" data-line=\"190\"><span class=\"no\">190</span><span class=\"source\">                                     (((raw &gt;&gt; 12) &amp; 0xffu) &lt;&lt; 12) |</span></div><div class=\"line\" data-line=\"191\"><span class=\"no\">191</span><span class=\"source\">                                     (((raw &gt;&gt; 20) &amp; 1u) &lt;&lt; 11) |</span></div><div class=\"line\" data-line=\"192\"><span class=\"no\">192</span><span class=\"source\">                                     (((raw &gt;&gt; 21) &amp; 0x3ffu) &lt;&lt; 1), 21);</span></div><div class=\"line\" data-line=\"193\"><span class=\"no\">193</span><span class=\"source\">    // result 在最後統一寫回 rd；STORE/BRANCH/invalid 不寫 rd。</span></div><div class=\"line\" data-line=\"194\"><span class=\"no\">194</span><span class=\"source\">    // bytes 為 LOAD/STORE 的小端序緩衝區；length 為存取位元組數。</span></div><div class=\"line\" data-line=\"195\"><span class=\"no\">195</span><span class=\"source\">    reg_t result = 0;</span></div><div class=\"line\" data-line=\"196\"><span class=\"no\">196</span><span class=\"source\">    bool write_rd = true;</span></div><div class=\"line\" data-line=\"197\"><span class=\"no\">197</span><span class=\"source\">    byte_t bytes[4] = { 0 };</span></div><div class=\"line\" data-line=\"198\"><span class=\"no\">198</span><span class=\"source\">    unsigned length = 0;</span></div><div class=\"line\" data-line=\"199\"><span class=\"no\">199</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"200\"><span class=\"no\">200</span><span class=\"source\">    // 各列舉值的語意：signed 比較先轉成 int32_t；unsigned 直接比較 reg_t。</span></div><div class=\"line\" data-line=\"201\"><span class=\"no\">201</span><span class=\"source\">    switch (inst_enum) {</span></div><div class=\"line\" data-line=\"202\"><span class=\"no\">202</span><span class=\"source\">    case inst_add: result = a + b; break;</span></div><div class=\"line\" data-line=\"203\"><span class=\"no\">203</span><span class=\"source\">    case inst_sub: result = a - b; break;</span></div><div class=\"line\" data-line=\"204\"><span class=\"no\">204</span><span class=\"source\">    case inst_sll: result = a &lt;&lt; shift; break;</span></div><div class=\"line\" data-line=\"205\"><span class=\"no\">205</span><span class=\"source\">    case inst_slt: result = (int32_t)a &lt; (int32_t)b; break;</span></div><div class=\"line\" data-line=\"206\"><span class=\"no\">206</span><span class=\"source\">    case inst_sltu: result = a &lt; b; break;</span></div><div class=\"line\" data-line=\"207\"><span class=\"no\">207</span><span class=\"source\">    case inst_xor: result = a ^ b; break;</span></div><div class=\"line\" data-line=\"208\"><span class=\"no\">208</span><span class=\"source\">    case inst_srl: result = a &gt;&gt; shift; break;</span></div><div class=\"line\" data-line=\"209\"><span class=\"no\">209</span><span class=\"source\">    // 算術右移複製符號位；邏輯右移在上方以無號 a &gt;&gt; shift 實作。</span></div><div class=\"line\" data-line=\"210\"><span class=\"no\">210</span><span class=\"source\">    case inst_sra: result = (reg_t)((int32_t)a &gt;&gt; shift); break;</span></div><div class=\"line\" data-line=\"211\"><span class=\"no\">211</span><span class=\"source\">    case inst_or: result = a | b; break;</span></div><div class=\"line\" data-line=\"212\"><span class=\"no\">212</span><span class=\"source\">    case inst_and: result = a &amp; b; break;</span></div><div class=\"line\" data-line=\"213\"><span class=\"no\">213</span><span class=\"source\">    case inst_addi: result = a + imm_i; break;</span></div><div class=\"line\" data-line=\"214\"><span class=\"no\">214</span><span class=\"source\">    case inst_slti: result = (int32_t)a &lt; (int32_t)imm_i; break;</span></div><div class=\"line\" data-line=\"215\"><span class=\"no\">215</span><span class=\"source\">    // SLTIU 的立即數先「符號延伸」再以 32 位元無號數比較。</span></div><div class=\"line\" data-line=\"216\"><span class=\"no\">216</span><span class=\"source\">    case inst_sltiu: result = a &lt; imm_i; break;</span></div><div class=\"line\" data-line=\"217\"><span class=\"no\">217</span><span class=\"source\">    case inst_xori: result = a ^ imm_i; break;</span></div><div class=\"line\" data-line=\"218\"><span class=\"no\">218</span><span class=\"source\">    case inst_ori: result = a | imm_i; break;</span></div><div class=\"line\" data-line=\"219\"><span class=\"no\">219</span><span class=\"source\">    case inst_andi: result = a &amp; imm_i; break;</span></div><div class=\"line\" data-line=\"220\"><span class=\"no\">220</span><span class=\"source\">    case inst_slli: result = a &lt;&lt; (imm_i &amp; 31u); break;</span></div><div class=\"line\" data-line=\"221\"><span class=\"no\">221</span><span class=\"source\">    case inst_srli: result = a &gt;&gt; (imm_i &amp; 31u); break;</span></div><div class=\"line\" data-line=\"222\"><span class=\"no\">222</span><span class=\"source\">    case inst_srai: result = (reg_t)((int32_t)a &gt;&gt; (imm_i &amp; 31u)); break;</span></div><div class=\"line\" data-line=\"223\"><span class=\"no\">223</span><span class=\"source\">    // LOAD：有效位址=舊 rs1 + I-type 立即數；從 MemoryMap 取 1／2／4 byte。</span></div><div class=\"line\" data-line=\"224\"><span class=\"no\">224</span><span class=\"source\">    // 逐 byte 依小端序重建；LB/LH 補 1 作符號延伸，LBU/LHU 保留零延伸。</span></div><div class=\"line\" data-line=\"225\"><span class=\"no\">225</span><span class=\"source\">    case inst_lb: case inst_lh: case inst_lw: case inst_lbu: case inst_lhu:</span></div><div class=\"line\" data-line=\"226\"><span class=\"no\">226</span><span class=\"source\">        length = inst_enum == inst_lb || inst_enum == inst_lbu ? 1u :</span></div><div class=\"line\" data-line=\"227\"><span class=\"no\">227</span><span class=\"source\">                 inst_enum == inst_lh || inst_enum == inst_lhu ? 2u : 4u;</span></div><div class=\"line\" data-line=\"228\"><span class=\"no\">228</span><span class=\"source\">        MemoryMap_generic_load(&amp;self-&gt;mem_map, a + imm_i, length, bytes);</span></div><div class=\"line\" data-line=\"229\"><span class=\"no\">229</span><span class=\"source\">        for (unsigned i = 0; i &lt; length; ++i) result |= (reg_t)bytes[i] &lt;&lt; (8u * i);</span></div><div class=\"line\" data-line=\"230\"><span class=\"no\">230</span><span class=\"source\">        if (inst_enum == inst_lb &amp;&amp; (result &amp; 0x80u)) result |= 0xffffff00u;</span></div><div class=\"line\" data-line=\"231\"><span class=\"no\">231</span><span class=\"source\">        if (inst_enum == inst_lh &amp;&amp; (result &amp; 0x8000u)) result |= 0xffff0000u;</span></div><div class=\"line\" data-line=\"232\"><span class=\"no\">232</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"233\"><span class=\"no\">233</span><span class=\"source\">    // STORE：有效位址=舊 rs1 + S-type 立即數；rs2 的低位 byte 先存到</span></div><div class=\"line\" data-line=\"234\"><span class=\"no\">234</span><span class=\"source\">    // 緩衝區，再透過 MemoryMap 寫入設備，且不得更改任何目的暫存器。</span></div><div class=\"line\" data-line=\"235\"><span class=\"no\">235</span><span class=\"source\">    case inst_sb: case inst_sh: case inst_sw:</span></div><div class=\"line\" data-line=\"236\"><span class=\"no\">236</span><span class=\"source\">        length = inst_enum == inst_sb ? 1u : inst_enum == inst_sh ? 2u : 4u;</span></div><div class=\"line\" data-line=\"237\"><span class=\"no\">237</span><span class=\"source\">        for (unsigned i = 0; i &lt; length; ++i) bytes[i] = (byte_t)(b &gt;&gt; (8u * i));</span></div><div class=\"line\" data-line=\"238\"><span class=\"no\">238</span><span class=\"source\">        MemoryMap_generic_store(&amp;self-&gt;mem_map, a + imm_s, length, bytes);</span></div><div class=\"line\" data-line=\"239\"><span class=\"no\">239</span><span class=\"source\">        write_rd = false;</span></div><div class=\"line\" data-line=\"240\"><span class=\"no\">240</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"241\"><span class=\"no\">241</span><span class=\"source\">    // BRANCH：條件成立時 new_pc=原 PC + B-type offset；否則維持 PC+4。</span></div><div class=\"line\" data-line=\"242\"><span class=\"no\">242</span><span class=\"source\">    // BLT/BGE 採有號比較，BLTU/BGEU 採無號比較，均不寫 rd。</span></div><div class=\"line\" data-line=\"243\"><span class=\"no\">243</span><span class=\"source\">    case inst_beq: case inst_bne: case inst_blt: case inst_bge:</span></div><div class=\"line\" data-line=\"244\"><span class=\"no\">244</span><span class=\"source\">    case inst_bltu: case inst_bgeu: {</span></div><div class=\"line\" data-line=\"245\"><span class=\"no\">245</span><span class=\"source\">        bool taken = false;</span></div><div class=\"line\" data-line=\"246\"><span class=\"no\">246</span><span class=\"source\">        switch (inst_enum) {</span></div><div class=\"line\" data-line=\"247\"><span class=\"no\">247</span><span class=\"source\">        case inst_beq: taken = a == b; break;</span></div><div class=\"line\" data-line=\"248\"><span class=\"no\">248</span><span class=\"source\">        case inst_bne: taken = a != b; break;</span></div><div class=\"line\" data-line=\"249\"><span class=\"no\">249</span><span class=\"source\">        case inst_blt: taken = (int32_t)a &lt; (int32_t)b; break;</span></div><div class=\"line\" data-line=\"250\"><span class=\"no\">250</span><span class=\"source\">        case inst_bge: taken = (int32_t)a &gt;= (int32_t)b; break;</span></div><div class=\"line\" data-line=\"251\"><span class=\"no\">251</span><span class=\"source\">        case inst_bltu: taken = a &lt; b; break;</span></div><div class=\"line\" data-line=\"252\"><span class=\"no\">252</span><span class=\"source\">        case inst_bgeu: taken = a &gt;= b; break;</span></div><div class=\"line\" data-line=\"253\"><span class=\"no\">253</span><span class=\"source\">        default: break;</span></div><div class=\"line\" data-line=\"254\"><span class=\"no\">254</span><span class=\"source\">        }</span></div><div class=\"line\" data-line=\"255\"><span class=\"no\">255</span><span class=\"source\">        if (taken) self-&gt;new_pc = self-&gt;arch_state.current_pc + imm_b;</span></div><div class=\"line\" data-line=\"256\"><span class=\"no\">256</span><span class=\"source\">        write_rd = false;</span></div><div class=\"line\" data-line=\"257\"><span class=\"no\">257</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"258\"><span class=\"no\">258</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"259\"><span class=\"no\">259</span><span class=\"source\">    // JAL：連結地址是「原 PC+4」，跳躍目標是「原 PC+J-type 偏移」。</span></div><div class=\"line\" data-line=\"260\"><span class=\"no\">260</span><span class=\"source\">    case inst_jal:</span></div><div class=\"line\" data-line=\"261\"><span class=\"no\">261</span><span class=\"source\">        result = self-&gt;new_pc;</span></div><div class=\"line\" data-line=\"262\"><span class=\"no\">262</span><span class=\"source\">        self-&gt;new_pc = self-&gt;arch_state.current_pc + imm_j;</span></div><div class=\"line\" data-line=\"263\"><span class=\"no\">263</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"264\"><span class=\"no\">264</span><span class=\"source\">    // JALR：連結地址是原 PC+4；目標=(舊 rs1+I-type 偏移)&amp;~1，清除 bit 0。</span></div><div class=\"line\" data-line=\"265\"><span class=\"no\">265</span><span class=\"source\">    case inst_jalr:</span></div><div class=\"line\" data-line=\"266\"><span class=\"no\">266</span><span class=\"source\">        result = self-&gt;new_pc;</span></div><div class=\"line\" data-line=\"267\"><span class=\"no\">267</span><span class=\"source\">        // Preserve rs1 before writing rd: jalr xN, xN, imm uses the old xN.</span></div><div class=\"line\" data-line=\"268\"><span class=\"no\">268</span><span class=\"source\">        self-&gt;new_pc = (a + imm_i) &amp; ~1u;</span></div><div class=\"line\" data-line=\"269\"><span class=\"no\">269</span><span class=\"source\">        break;</span></div><div class=\"line\" data-line=\"270\"><span class=\"no\">270</span><span class=\"source\">    // U-type 立即數佔 bits[31:12]，低 12 bits 自動為零。</span></div><div class=\"line\" data-line=\"271\"><span class=\"no\">271</span><span class=\"source\">    case inst_lui: result = raw &amp; 0xfffff000u; break;</span></div><div class=\"line\" data-line=\"272\"><span class=\"no\">272</span><span class=\"source\">    case inst_auipc: result = self-&gt;arch_state.current_pc + (raw &amp; 0xfffff000u); break;</span></div><div class=\"line\" data-line=\"273\"><span class=\"no\">273</span><span class=\"source\">    // 非作業要求的編碼不執行指定功能（框架既有預設 PC+4）。</span></div><div class=\"line\" data-line=\"274\"><span class=\"no\">274</span><span class=\"source\">    case inst_invalid: write_rd = false; break;</span></div><div class=\"line\" data-line=\"275\"><span class=\"no\">275</span><span class=\"source\">    }</span></div><div class=\"line\" data-line=\"276\"><span class=\"no\">276</span><span class=\"source\">    // x0 永遠為 0；即使一條指令以 rd=x0 為目標，也忽略寫入。</span></div><div class=\"line\" data-line=\"277\"><span class=\"no\">277</span><span class=\"source\">    if (write_rd &amp;&amp; rd != 0) self-&gt;arch_state.gpr[rd] = result;</span></div><div class=\"line\" data-line=\"278\"><span class=\"no\">278</span><span class=\"source\">    self-&gt;arch_state.gpr[0] = 0;</span></div><div class=\"line\" data-line=\"279\"><span class=\"no\">279</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"280\"><span class=\"no\">280</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"281\"><span class=\"no\">281</span><span class=\"source\">// 每一步最後才把暫存的 new_pc 正式提交為下一條指令地址。</span></div><div class=\"line\" data-line=\"282\"><span class=\"no\">282</span><span class=\"source\">static void Core_update_pc(Core *self) {</span></div><div class=\"line\" data-line=\"283\"><span class=\"no\">283</span><span class=\"source\">    self-&gt;arch_state.current_pc = self-&gt;new_pc;</span></div><div class=\"line\" data-line=\"284\"><span class=\"no\">284</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"285\"><span class=\"no\">285</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"286\"><span class=\"no\">286</span><span class=\"source\">// Tick 回呼實作單一步驟：Fetch → Decode → Execute → 更新 PC。</span></div><div class=\"line\" data-line=\"287\"><span class=\"no\">287</span><span class=\"source\">DECLARE_TICK_TICK(Core) {</span></div><div class=\"line\" data-line=\"288\"><span class=\"no\">288</span><span class=\"source\">    Core *self_               = container_of(self, Core, super);</span></div><div class=\"line\" data-line=\"289\"><span class=\"no\">289</span><span class=\"source\">    inst_fields_t inst_fields = Core_fetch(self_);</span></div><div class=\"line\" data-line=\"290\"><span class=\"no\">290</span><span class=\"source\">    inst_enum_t inst_enum     = Core_decode(self_, inst_fields);</span></div><div class=\"line\" data-line=\"291\"><span class=\"no\">291</span><span class=\"source\">    Core_execute(self_, inst_fields, inst_enum);</span></div><div class=\"line\" data-line=\"292\"><span class=\"no\">292</span><span class=\"source\">    Core_update_pc(self_);</span></div><div class=\"line\" data-line=\"293\"><span class=\"no\">293</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"294\"><span class=\"no\">294</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"295\"><span class=\"no\">295</span><span class=\"source\">// 建構子：清空 PC 與全部 32 個暫存器，建立記憶體映射及 Tick 回呼。</span></div><div class=\"line\" data-line=\"296\"><span class=\"no\">296</span><span class=\"source\">void Core_ctor(Core *self) {</span></div><div class=\"line\" data-line=\"297\"><span class=\"no\">297</span><span class=\"source\">    assert(self != NULL);</span></div><div class=\"line\" data-line=\"298\"><span class=\"no\">298</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"299\"><span class=\"no\">299</span><span class=\"source\">    // 確定性的初始狀態：PC、暫存器及下一個 PC 全為 0。</span></div><div class=\"line\" data-line=\"300\"><span class=\"no\">300</span><span class=\"source\">    self-&gt;arch_state = (arch_state_t){ 0 };</span></div><div class=\"line\" data-line=\"301\"><span class=\"no\">301</span><span class=\"source\">    self-&gt;new_pc      = 0;</span></div><div class=\"line\" data-line=\"302\"><span class=\"no\">302</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"303\"><span class=\"no\">303</span><span class=\"source\">    // initialize memory map object</span></div><div class=\"line\" data-line=\"304\"><span class=\"no\">304</span><span class=\"source\">    // prepare for being added new MMIO devices</span></div><div class=\"line\" data-line=\"305\"><span class=\"no\">305</span><span class=\"source\">    MemoryMap_ctor(&amp;self-&gt;mem_map);</span></div><div class=\"line\" data-line=\"306\"><span class=\"no\">306</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"307\"><span class=\"no\">307</span><span class=\"source\">    // initialize base class (Tick)</span></div><div class=\"line\" data-line=\"308\"><span class=\"no\">308</span><span class=\"source\">    Tick_ctor(&amp;self-&gt;super);</span></div><div class=\"line\" data-line=\"309\"><span class=\"no\">309</span><span class=\"source\">    static struct TickVtbl const vtbl = { .tick = SIGNATURE_TICK_TICK(Core) };</span></div><div class=\"line\" data-line=\"310\"><span class=\"no\">310</span><span class=\"source\">    self-&gt;super.vtbl                  = &amp;vtbl;</span></div><div class=\"line\" data-line=\"311\"><span class=\"no\">311</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"312\"><span class=\"no\">312</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"313\"><span class=\"no\">313</span><span class=\"source\">// 解構子：釋放由 MemoryMap 管理的設備映射陣列。</span></div><div class=\"line\" data-line=\"314\"><span class=\"no\">314</span><span class=\"source\">void Core_dtor(Core *self) {</span></div><div class=\"line\" data-line=\"315\"><span class=\"no\">315</span><span class=\"source\">    assert(self != NULL);</span></div><div class=\"line\" data-line=\"316\"><span class=\"no\">316</span><span class=\"source\">    MemoryMap_dtor(&amp;self-&gt;mem_map);</span></div><div class=\"line\" data-line=\"317\"><span class=\"no\">317</span><span class=\"source\">}</span></div><div class=\"line\" data-line=\"318\"><span class=\"no\">318</span><span class=\"source\"> </span></div><div class=\"line\" data-line=\"319\"><span class=\"no\">319</span><span class=\"source\">// 將 ROM、MainMem 或其他 MMIO 設備登錄到核心記憶體映射表。</span></div><div class=\"line\" data-line=\"320\"><span class=\"no\">320</span><span class=\"source\">int Core_add_device(Core *self, mmap_unit_t new_device) {</span></div><div class=\"line\" data-line=\"321\"><span class=\"no\">321</span><span class=\"source\">    return MemoryMap_add_device(&amp;self-&gt;mem_map, new_device);</span></div><div class=\"line\" data-line=\"322\"><span class=\"no\">322</span><span class=\"source\">}</span></div>";
document.getElementById('old').innerHTML=oldLines;document.getElementById('new').innerHTML=newLines;
let index=0,timer=null,all=false;const $=id=>document.getElementById(id);
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 播放'}
function update(animate=true){const s=steps[index];$('count').textContent=`${index+1} / ${steps.length}`;$('seek').value=index;$('heading').textContent=`第 ${index+1} 步｜${s.title}`;$('description').textContent=s.desc;$('ranges').textContent=`左側第 ${s.old[0]}–${s.old[1]} 行 → 右側第 ${s.new[0]}–${s.new[1]} 行；範圍表示對照區段，不代表每一行一對一替換。`;
for(const [id,key,focus] of [['old','old','focus-old'],['new','new','focus-new']]){const box=$(id);for(const el of box.children){const n=Number(el.dataset.line),hit=n>=s[key][0]&&n<=s[key][1];el.className='line'+(hit?' '+focus:all?'':' dim');el.style.animationDelay='';if(hit&&id==='new'&&animate){el.classList.add('appear');el.style.animationDelay=Math.min((n-s.new[0])*28,840)+'ms'}}const first=box.children[s[key][0]-1];if(first)box.scrollTo({top:Math.max(0,first.offsetTop-box.offsetTop-70),behavior:animate?'smooth':'instant'})}
for(const [i,b] of [...$('timeline').children].entries())b.classList.toggle('active',i===index);$('prev').disabled=index===0;$('next').disabled=index===steps.length-1}
steps.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=`${i+1} ${s.title}`;b.onclick=()=>{stop();index=i;update()};$('timeline').append(b)});
$('prev').onclick=()=>{stop();index=Math.max(0,index-1);update()};$('next').onclick=()=>{stop();index=Math.min(steps.length-1,index+1);update()};$('seek').oninput=e=>{stop();index=Number(e.target.value);update()};$('show').onclick=()=>{all=!all;$('show').textContent=all?'淡化非焦點行':'顯示完整程式';update(false)};
$('play').onclick=()=>{if(timer){stop();return}if(index===steps.length-1)index=0;update();$('play').textContent='⏸ 暫停';timer=setInterval(()=>{if(index===steps.length-1){stop();return}index++;update()},Number($('speed').value))};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});update(false);
</script></html>
