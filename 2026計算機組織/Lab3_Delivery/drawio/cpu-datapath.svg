w_en</text><text x="352" y="1078" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">ALU decode forwarding: alu_opcode, alu_func3, alu_func7; IM write enable always zero</text><text x="40" y="1145" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Named inputs also used in Top: JB base = PC or rs1; store data = rs2; PC+4 feeds write-back MUX.</text><text x="40" y="1169" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">DM: address={alu_out[31:2],00}; offset=alu_out[1:0]; data/mask lane positioning belongs to Top.</text><text x="40" y="1193" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Control wires are listed on page 2 to keep this datapath readable. All nine RTL modules are shown.</text></svg>