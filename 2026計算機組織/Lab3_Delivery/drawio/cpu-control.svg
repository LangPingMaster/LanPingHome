<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256483"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><text x="40" y="52" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="28">Control, partial access and required interfaces</text><text x="40" y="85" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Lab3 RV32I | matched to supplied Top.v | editable blocks and connectors</text><rect x="50" y="150" width="1500" height="225" rx="12" fill="#fce3d7" stroke="#446584" stroke-width="2"/><text x="62" y="181" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Controller -&gt; exact Top destinations</text><text x="62" y="203" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">next_pc_sel -&gt; next_pc MUX: 0=PC+4; 1=jb_pc</text><text x="62" y="228" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">jb_op1_sel -&gt; JB operand1: 0=PC; 1=rs1_data</text><text x="62" y="253" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">alu_op1_sel -&gt; ALU operand1: 0=rs1_data; 1=PC</text><text x="62" y="278" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">alu_op2_sel -&gt; ALU operand2: 0=rs2_data; 1=imm</text><text x="62" y="303" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">alu_opcode / alu_func3 / alu_func7 -&gt; ALU decode inputs</text><text x="62" y="328" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">im_w_en -&gt; IM.w_en; always 0000</text><rect x="50" y="410" width="720" height="190" rx="12" fill="#e8e1ff" stroke="#446584" stroke-width="2"/><text x="62" y="441" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Write-back control</text><text x="62" y="463" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">wb_en &amp;&amp; rst -&gt; RegFile.wb_en</text><text x="62" y="488" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">wb_sel=1 -&gt; ld_data_f</text><text x="62" y="513" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">wb_sel=0 and JAL/JALR -&gt; pc_plus4</text><text x="62" y="538" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">wb_sel=0 otherwise -&gt; alu_out</text><text x="62" y="563" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">rd_index selects destination; x0 remains zero</text><rect x="820" y="410" width="730" height="190" rx="12" fill="#dcf1df" stroke="#446584" stroke-width="2"/><text x="832" y="441" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Store and load positioning in Top</text><text x="832" y="463" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">byte_offset = alu_out[1:0]; byte_shift = offset * 8</text><text x="832" y="488" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">dm_address = {alu_out[31:2], 2&#x27;b00}</text><text x="832" y="513" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">dm_write_data = rs2_data &lt;&lt; byte_shift</text><text x="832" y="538" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">dm_mask = rst ? dm_w_en &lt;&lt; byte_offset : 0</text><text x="832" y="563" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">ld_data = dm_read_data &gt;&gt; byte_shift</text><rect x="50" y="640" width="720" height="165" rx="12" fill="#d8f3fa" stroke="#446584" stroke-width="2"/><text x="62" y="671" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Clock / reset / termination</text><text x="62" y="693" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">clk -&gt; Reg_PC, RegFile, IM, DM</text><text x="62" y="718" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">rst=0 -&gt; PC=0 and all registers=0 asynchronously</text><text x="62" y="743" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">rst=0 -&gt; DM write mask = 0000</text><text x="62" y="768" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">DM.halt directly drives Top.halt</text><rect x="820" y="640" width="730" height="165" rx="12" fill="#fff0cf" stroke="#446584" stroke-width="2"/><text x="832" y="671" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Control transfer</text><text x="832" y="693" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">ALU.jump -&gt; Controller: branch comparison result</text><text x="832" y="718" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">branch: next_pc_sel = jump</text><text x="832" y="743" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">JAL / JALR: next_pc_sel = 1</text><text x="832" y="768" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">JALR target = {jb_out[31:1], 1&#x27;b0}</text><rect x="50" y="850" width="1500" height="210" rx="12" fill="#e8e1ff" stroke="#446584" stroke-width="2"/><text x="62" y="881" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Required memory cases and interface names</text><text x="62" y="903" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Basic dm_w_en: SB=0001; SH=0011; SW=1111; non-store=0000</text><text x="62" y="928" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Byte offsets 0/1/2/3; halfword offsets 0/1/2 (including 1); word offset 0; no cross-word access required.</text><text x="62" y="953" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Required instances: PC / regfile / IM / DM; register array: regfile.registers</text><text x="62" y="978" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Decoder opcode=inst[6:2] (5 bits); func7=inst[30] (1 bit).</text><text x="62" y="1003" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="14">Source preserves IM.halt connected to im_halt_unused; handout asks for .halt() unconnected.</text><text x="40" y="1145" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">These pages explain the supplied RTL; they are not evidence of a newly executed CPU test.</text><text x="40" y="1169" fill="#18334b" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Editable .drawio and SVG/PNG previews are generated from the same node and connector model.</text></svg>