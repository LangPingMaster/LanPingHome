<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1560" viewBox="0 0 1400 1560"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245f91"/></marker></defs><rect width="1400" height="1560" fill="white"/><text x="35" y="44" font-family="Arial,sans-serif" font-size="29" fill="#183650">Lab3 single-cycle CPU — architecture matched to Top.v</text><text x="35" y="77" font-family="Arial,sans-serif" font-size="18" fill="#183650">Blue arrows: main data flow. Orange panel: control mapping. Named signals join the panels.</text><text x="35" y="122" font-family="Arial,sans-serif" font-size="24" fill="#183650">A. Instruction fetch, decode and main execution path</text><rect x="35" y="150" width="250" height="115" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="51" y="180" font-family="Arial,sans-serif" font-size="22" fill="#183650">Reg_PC PC</text><text x="51" y="209" font-family="Arial,sans-serif" font-size="17" fill="#183650">clk, rst, next_pc</text><text x="51" y="234" font-family="Arial,sans-serif" font-size="17" fill="#183650">current_pc -&gt; pc</text><rect x="370" y="150" width="250" height="115" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="386" y="180" font-family="Arial,sans-serif" font-size="22" fill="#183650">SRAM IM</text><text x="386" y="209" font-family="Arial,sans-serif" font-size="17" fill="#183650">READ_ONLY=1</text><text x="386" y="234" font-family="Arial,sans-serif" font-size="17" fill="#183650">address=pc; read=inst</text><rect x="730" y="150" width="265" height="115" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="746" y="180" font-family="Arial,sans-serif" font-size="22" fill="#183650">Decoder decoder</text><text x="746" y="209" font-family="Arial,sans-serif" font-size="17" fill="#183650">inst -&gt; opcode/func3/func7</text><text x="746" y="234" font-family="Arial,sans-serif" font-size="17" fill="#183650">rs1/rs2/rd_index</text><path d="M285 210 L370 210" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="196" font-family="Arial,sans-serif" font-size="17" fill="#183650">pc</text><path d="M620 210 L730 210" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650" y="196" font-family="Arial,sans-serif" font-size="17" fill="#183650">inst</text><rect x="730" y="340" width="265" height="125" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="746" y="370" font-family="Arial,sans-serif" font-size="22" fill="#183650">RegFile regfile</text><text x="746" y="399" font-family="Arial,sans-serif" font-size="17" fill="#183650">clk, rst; wb_en &amp;&amp; rst</text><text x="746" y="424" font-family="Arial,sans-serif" font-size="17" fill="#183650">wb_data, rd_index</text><text x="746" y="449" font-family="Arial,sans-serif" font-size="17" fill="#183650">rs1_data / rs2_data</text><path d="M860 265 L860 340" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="870" y="310" font-family="Arial,sans-serif" font-size="17" fill="#183650">indices</text><rect x="35" y="340" width="250" height="125" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="51" y="370" font-family="Arial,sans-serif" font-size="22" fill="#183650">Imme_Ext imme_ext</text><text x="51" y="399" font-family="Arial,sans-serif" font-size="17" fill="#183650">input: inst</text><text x="51" y="424" font-family="Arial,sans-serif" font-size="17" fill="#183650">output: imm</text><text x="51" y="449" font-family="Arial,sans-serif" font-size="17" fill="#183650">I / S / B / U / J</text><text x="35" y="322" font-family="Arial,sans-serif" font-size="17" fill="#183650">inst from IM (shared signal)</text><rect x="370" y="340" width="250" height="125" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="386" y="370" font-family="Arial,sans-serif" font-size="22" fill="#183650">ALU operand MUXes</text><text x="386" y="399" font-family="Arial,sans-serif" font-size="17" fill="#183650">op1: rs1_data / pc</text><text x="386" y="424" font-family="Arial,sans-serif" font-size="17" fill="#183650">op2: rs2_data / imm</text><text x="386" y="449" font-family="Arial,sans-serif" font-size="17" fill="#183650">select: alu_op1/2_sel</text><path d="M730 400 L620 400" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="635" y="385" font-family="Arial,sans-serif" font-size="17" fill="#183650">rs1/rs2</text><path d="M285 400 L370 400" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="385" font-family="Arial,sans-serif" font-size="17" fill="#183650">imm</text><rect x="370" y="540" width="250" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="386" y="570" font-family="Arial,sans-serif" font-size="22" fill="#183650">ALU alu</text><text x="386" y="599" font-family="Arial,sans-serif" font-size="17" fill="#183650">opcode / func3 / func7</text><text x="386" y="624" font-family="Arial,sans-serif" font-size="17" fill="#183650">alu_out: result / address</text><text x="386" y="649" font-family="Arial,sans-serif" font-size="17" fill="#183650">jump: branch condition</text><path d="M495 465 L495 540" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="505" font-family="Arial,sans-serif" font-size="17" fill="#183650">operands</text><rect x="730" y="540" width="265" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="746" y="570" font-family="Arial,sans-serif" font-size="22" fill="#183650">Top: byte positioning</text><text x="746" y="599" font-family="Arial,sans-serif" font-size="17" fill="#183650">offset=alu_out[1:0]</text><text x="746" y="624" font-family="Arial,sans-serif" font-size="17" fill="#183650">shift={offset,3'b000}</text><text x="746" y="649" font-family="Arial,sans-serif" font-size="17" fill="#183650">aligned address / data / mask</text><path d="M620 600 L730 600" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="634" y="585" font-family="Arial,sans-serif" font-size="17" fill="#183650">alu_out</text><rect x="1080" y="540" width="280" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="1096" y="570" font-family="Arial,sans-serif" font-size="22" fill="#183650">SRAM DM</text><text x="1096" y="599" font-family="Arial,sans-serif" font-size="17" fill="#183650">READ_ONLY=0</text><text x="1096" y="624" font-family="Arial,sans-serif" font-size="17" fill="#183650">dm_address / dm_write_data</text><text x="1096" y="649" font-family="Arial,sans-serif" font-size="17" fill="#183650">dm_mask; halt -&gt; Top.halt</text><path d="M995 600 L1080 600" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1000" y="585" font-family="Arial,sans-serif" font-size="17" fill="#183650">DM I/F</text><text x="730" y="688" font-family="Arial,sans-serif" font-size="17" fill="#183650">Store input: rs2_data + dm_w_en; reset forces dm_mask=0.</text><rect x="1080" y="745" width="280" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="1096" y="775" font-family="Arial,sans-serif" font-size="22" fill="#183650">Top: load shift</text><text x="1096" y="804" font-family="Arial,sans-serif" font-size="17" fill="#183650">dm_read_data &gt;&gt; byte_shift</text><text x="1096" y="829" font-family="Arial,sans-serif" font-size="17" fill="#183650">output: ld_data</text><path d="M1220 660 L1220 745" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1230" y="710" font-family="Arial,sans-serif" font-size="17" fill="#183650">dm_read_data</text><rect x="730" y="745" width="265" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="746" y="775" font-family="Arial,sans-serif" font-size="22" fill="#183650">LD_Filter ld_filter</text><text x="746" y="804" font-family="Arial,sans-serif" font-size="17" fill="#183650">func3 + ld_data</text><text x="746" y="829" font-family="Arial,sans-serif" font-size="17" fill="#183650">LB/LH/LW/LBU/LHU</text><text x="746" y="854" font-family="Arial,sans-serif" font-size="17" fill="#183650">output: ld_data_f</text><path d="M1080 805 L995 805" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1000" y="790" font-family="Arial,sans-serif" font-size="17" fill="#183650">ld_data</text><rect x="370" y="745" width="250" height="120" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="386" y="775" font-family="Arial,sans-serif" font-size="22" fill="#183650">Top: write-back MUX</text><text x="386" y="804" font-family="Arial,sans-serif" font-size="17" fill="#183650">wb_sel ? ld_data_f :</text><text x="386" y="829" font-family="Arial,sans-serif" font-size="17" fill="#183650">JAL/JALR ? pc_plus4 :</text><text x="386" y="854" font-family="Arial,sans-serif" font-size="17" fill="#183650">alu_out -&gt; wb_data</text><path d="M730 805 L620 805" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="624" y="790" font-family="Arial,sans-serif" font-size="17" fill="#183650">ld_data_f</text><text x="35" y="785" font-family="Arial,sans-serif" font-size="18" fill="#183650">wb_data -&gt; regfile.wb_data</text><text x="35" y="815" font-family="Arial,sans-serif" font-size="17" fill="#183650">RegFile updates at posedge clk.</text><path d="M370 820 L300 820" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="920" font-family="Arial,sans-serif" font-size="24" fill="#183650">B. Next-PC path and target calculation (all 32-bit)</text><rect x="35" y="950" width="285" height="140" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="51" y="980" font-family="Arial,sans-serif" font-size="22" fill="#183650">Top: JB operand MUX</text><text x="51" y="1009" font-family="Arial,sans-serif" font-size="17" fill="#183650">jb_op1_sel=0: pc</text><text x="51" y="1034" font-family="Arial,sans-serif" font-size="17" fill="#183650">=1: rs1_data</text><text x="51" y="1059" font-family="Arial,sans-serif" font-size="17" fill="#183650">operand2=imm</text><rect x="400" y="950" width="270" height="140" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="416" y="980" font-family="Arial,sans-serif" font-size="22" fill="#183650">JB_Unit jb_unit</text><text x="416" y="1009" font-family="Arial,sans-serif" font-size="17" fill="#183650">jb_out = operand1 + imm</text><text x="416" y="1034" font-family="Arial,sans-serif" font-size="17" fill="#183650">Top clears bit0 for JALR</text><text x="416" y="1059" font-family="Arial,sans-serif" font-size="17" fill="#183650">output: jb_pc</text><rect x="760" y="950" width="300" height="140" rx="12" fill="#eff6fd" stroke="#7dabc9" stroke-width="2"/><text x="776" y="980" font-family="Arial,sans-serif" font-size="22" fill="#183650">Top: next-PC MUX</text><text x="776" y="1009" font-family="Arial,sans-serif" font-size="17" fill="#183650">pc_plus4 = pc + 4</text><text x="776" y="1034" font-family="Arial,sans-serif" font-size="17" fill="#183650">next_pc_sel ? jb_pc : pc_plus4</text><text x="776" y="1059" font-family="Arial,sans-serif" font-size="17" fill="#183650">output: next_pc -&gt; PC</text><path d="M320 1020 L400 1020" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M670 1020 L760 1020" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="1010" font-family="Arial,sans-serif" font-size="19" fill="#183650">next_pc</text><text x="1090" y="1040" font-family="Arial,sans-serif" font-size="19" fill="#183650">to Reg_PC PC</text><path d="M1060 1020 L1085 1020" fill="none" stroke="#245f91" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="1140" font-family="Arial,sans-serif" font-size="24" fill="#183650">C. Controller control signals (shared wires to panels A/B)</text><rect x="35" y="1165" width="1325" height="330" rx="12" fill="#fff8e8" stroke="#d1a553" stroke-width="2"/><text x="55" y="1200" font-family="Arial,sans-serif" font-size="21" fill="#183650">Controller controller: inputs opcode, func3, func7 from Decoder; jump from ALU</text><text x="55" y="1237" font-family="Arial,sans-serif" font-size="18" fill="#183650">alu_op1_sel</text><text x="440" y="1237" font-family="Arial,sans-serif" font-size="18" fill="#183650">ALU op1: 0=rs1_data, 1=pc</text><text x="55" y="1270" font-family="Arial,sans-serif" font-size="18" fill="#183650">alu_op2_sel</text><text x="440" y="1270" font-family="Arial,sans-serif" font-size="18" fill="#183650">ALU op2: 0=rs2_data, 1=imm</text><text x="55" y="1303" font-family="Arial,sans-serif" font-size="18" fill="#183650">jb_op1_sel</text><text x="440" y="1303" font-family="Arial,sans-serif" font-size="18" fill="#183650">JB base: 0=pc, 1=rs1_data</text><text x="55" y="1336" font-family="Arial,sans-serif" font-size="18" fill="#183650">next_pc_sel</text><text x="440" y="1336" font-family="Arial,sans-serif" font-size="18" fill="#183650">next_pc: 0=pc_plus4, 1=jb_pc</text><text x="55" y="1369" font-family="Arial,sans-serif" font-size="18" fill="#183650">wb_en / wb_sel</text><text x="440" y="1369" font-family="Arial,sans-serif" font-size="18" fill="#183650">register write enable / 0=non-load, 1=load</text><text x="55" y="1402" font-family="Arial,sans-serif" font-size="18" fill="#183650">dm_w_en / im_w_en</text><text x="440" y="1402" font-family="Arial,sans-serif" font-size="18" fill="#183650">base store mask -&gt; Top shift / IM mask always 0000</text><text x="55" y="1435" font-family="Arial,sans-serif" font-size="18" fill="#183650">alu_opcode/func3/func7</text><text x="440" y="1435" font-family="Arial,sans-serif" font-size="18" fill="#183650">forward instruction class / function fields to ALU</text><text x="35" y="1535" font-family="Arial,sans-serif" font-size="18" fill="#183650">State: PC + RegFile; reset active low asynchronous. DM writes are blocked during reset.</text></svg>